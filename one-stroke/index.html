<script>
// 한 획 골인 — 선 하나만 그어서 공을 컵에 넣는 물리 퍼즐. 75초 동안 몇 번 넣을까?
// 그림·소리 모두 코드로 생성(외부 파일·인터넷 없음). 레벨은 자동 생성 + 풀이기로 풀 수 있는지 검증.
'use strict';
(() => {
const Q = new URLSearchParams(location.search);
const REC = Q.has('record'), TEST = Q.has('test');
const SEED = +(Q.get('seed') || 0) || (Date.now() % 100000);
const WW = 1000, WH = 1600, BR = 26, G = 1900, STEP = 1 / 120, ROUND = +(Q.get('round') || 75);
const INK = '#1B2340', BLUE = '#2F6FDB', RED = '#E5484D', ORANGE = '#FF7A1A', PAPER = '#F4EEDF';
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SC = 1, OX = 0, OY = 0, HUD = 60;

function rng(s) { return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seg(ax, ay, bx, by, k, t) {
  return { ax, ay, bx, by, k, t, x0: Math.min(ax, bx) - t, x1: Math.max(ax, bx) + t, y0: Math.min(ay, by) - t, y1: Math.max(ay, by) + t };
}
function segDist(s, x, y) { const dx = s.bx - s.ax, dy = s.by - s.ay, L2 = dx * dx + dy * dy || 1e-9;
  let u = ((x - s.ax) * dx + (y - s.ay) * dy) / L2; u = u < 0 ? 0 : u > 1 ? 1 : u; return Math.hypot(x - s.ax - dx * u, y - s.ay - dy * u); }

// ── 물리: 공 한 스텝(중력 → 이동 → 선분 충돌). 게임·풀이기·테스트가 모두 이 함수 하나를 쓴다
function rollStep(R, L, segs) {
  const b = R.b; b.vy += G * STEP; b.x += b.vx * STEP; b.y += b.vy * STEP; R.t += STEP; R.imp = 0;
  for (const s of segs) {
    if (b.x < s.x0 - BR || b.x > s.x1 + BR || b.y < s.y0 - BR || b.y > s.y1 + BR) continue;
    const dx = s.bx - s.ax, dy = s.by - s.ay, L2 = dx * dx + dy * dy || 1e-9, Rr = BR + s.t;
    let u = ((b.x - s.ax) * dx + (b.y - s.ay) * dy) / L2; u = u < 0 ? 0 : u > 1 ? 1 : u;
    let nx = b.x - (s.ax + dx * u), ny = b.y - (s.ay + dy * u); const d = Math.hypot(nx, ny);
    if (d >= Rr) continue;
    if (s.k === 'spike') return 'spike';
    if (d < 1e-6) { nx = 0; ny = -1; } else { nx /= d; ny /= d; }
    b.x += nx * (Rr - d); b.y += ny * (Rr - d);
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) {
      const e = s.k === 'wall' ? 0.45 : 0.2;
      b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
      const tx = -ny, ty = nx, vt = b.vx * tx + b.vy * ty;
      b.vx -= vt * tx * 0.003; b.vy -= vt * ty * 0.003;
      R.imp = Math.max(R.imp, -vn);
    }
  }
  const c = L.cup;
  if (Math.abs(b.x - c.x) < c.w / 2 - BR * 0.4 && b.y > c.y + BR * 0.2 && b.y < c.y + c.h) { if ((R.hold += STEP) > 0.2) return 'win'; } else R.hold = 0;
  R.still = Math.hypot(b.vx, b.vy) < 25 ? R.still + STEP : 0;
  if (b.y > WH + 80 || b.x < -80 || b.x > WW + 80 || R.t > 7 || R.still > 1) return 'miss';
  return null;
}
function newRoll(L) { return { b: { x: L.ball.x, y: L.ball.y, vx: 0, vy: 0 }, t: 0, hold: 0, still: 0, imp: 0 }; }
function simulate(L, segs) { const R = newRoll(L), all = L.segs.concat(segs); for (;;) { const r = rollStep(R, L, all); if (r) return r; } }

// ── 한 획: 공 출발점 근처엔 못 그림(펜이 들림), 잉크만큼만
function addPoint(st, L, x, y) {
  x = Math.max(8, Math.min(WW - 8, x)); y = Math.max(8, Math.min(WH - 8, y));
  if (Math.hypot(x - L.ball.x, y - L.ball.y) < BR + 34) { st.last = null; return false; }
  if (st.last) { const d = Math.hypot(x - st.last.x, y - st.last.y); if (d < 10) return false;
    if (d > st.ink) { st.out = true; return false; }
    st.segs.push(seg(st.last.x, st.last.y, x, y, 'ink', 7)); st.ink -= d; }
  st.last = { x, y }; return true;
}
function newStroke(L) { return { segs: [], last: null, ink: L.ink, out: false }; }

// ── 풀이기: 무작위 곡선(2차 베지어)을 그어 보고 실제 물리로 굴려 본다
function candidate(L, r) {
  const b = L.ball, c = L.cup;
  const x0 = b.x + (r() - 0.5) * 320, y0 = b.y + 60 + r() * 460;
  const x2 = x0 + (c.x - x0) * (0.2 + r()) + (r() - 0.5) * 240, y2 = Math.min(c.y - 40, y0 + (r() - 0.2) * 640);
  const x1 = (x0 + x2) / 2 + (r() - 0.5) * 440, y1 = (y0 + y2) / 2 + (r() - 0.5) * 440;
  const n = Math.max(8, Math.round(Math.hypot(x2 - x0, y2 - y0) / 13)), pts = [];
  for (let i = 0; i <= n; i++) { const u = i / n, v = 1 - u; pts.push({ x: v * v * x0 + 2 * v * u * x1 + u * u * x2, y: v * v * y0 + 2 * v * u * y1 + u * u * y2 }); }
  pts.bend = Math.hypot(x1 - (x0 + x2) / 2, y1 - (y0 + y2) / 2) / (Math.hypot(x2 - x0, y2 - y0) + 1);
  return pts;
}
function solve(L, r, budget, best) {
  let found = null;
  for (let k = 0; k < budget; k++) {
    const pts = candidate(L, r), st = newStroke(L);
    for (const p of pts) addPoint(st, L, p.x, p.y);
    const used = L.ink - st.ink, score = used * (1 + 1.5 * pts.bend);   // 잉크 적게 + 덜 꺾인 선 우선
    if (st.segs.length < 4 || used < 80 || (found && score >= found.score)) continue;
    if (simulate(L, st.segs) === 'win') { found = { pts, used, score }; if (!best) break; }
  }
  return found;
}

// ── 레벨 생성: 벽·가시를 놓고, 풀이기가 풀 수 있고 그냥 떨어뜨리면 안 들어가는 것만 채택
function makeLevel(n) {
  for (let tries = 0; ; tries++) {
    const r = rng(SEED * 7919 + n * 104729 + tries * 31);
    const L = { n, ball: { x: 130 + r() * 740, y: 130 }, segs: [], ink: Math.max(520, 950 - n * 30) };
    const cw = 175 - Math.min(n, 10) * 4, ch = 120; let cxp;
    do cxp = 130 + r() * 740; while (Math.abs(cxp - L.ball.x) < 260);
    const c = L.cup = { x: cxp, y: 1250 + r() * 180, w: cw, h: ch };
    L.segs.push(seg(c.x - c.w / 2, c.y, c.x - c.w / 2 + 8, c.y + c.h, 'cup', 9), seg(c.x + c.w / 2, c.y, c.x + c.w / 2 - 8, c.y + c.h, 'cup', 9),
      seg(c.x - c.w / 2 + 8, c.y + c.h, c.x + c.w / 2 - 8, c.y + c.h, 'cup', 9));
    const nw = Math.min(1 + ((n - 1) >> 1), 4), ns = n >= 3 ? Math.min(1 + ((n - 3) / 3 | 0), 3) : 0;
    const put = (k, t, lmin, lmax, amax) => {
      for (let a = 0; a < 40; a++) {
        const mx = 100 + r() * 800, my = 420 + r() * 720, len = lmin + r() * (lmax - lmin), an = (r() - 0.5) * 2 * amax;
        const s = seg(mx - Math.cos(an) * len / 2, my - Math.sin(an) * len / 2, mx + Math.cos(an) * len / 2, my + Math.sin(an) * len / 2, k, t);
        if (segDist(s, L.ball.x, L.ball.y) < 170 || segDist(s, c.x, c.y + 40) < 190) continue;
        if (L.segs.some(o => o.k !== 'cup' && Math.hypot((o.ax + o.bx) / 2 - mx, (o.ay + o.by) / 2 - my) < 150)) continue;
        s.j = r() * 1000; L.segs.push(s); return;
      }
    };
    for (let i = 0; i < nw; i++) put('wall', 10, 160, 360, 0.7);
    for (let i = 0; i < ns; i++) put('spike', 9, 120, 260, 0.35);
    if (simulate(L, []) === 'win') continue;
    const sol = solve(L, rng(n * 977 + tries), 260, false);
    if (sol) { L.tries = tries; L.sol = sol; return L; }
  }
}

// ── 소리: WebAudio로 즉석 합성 (첫 터치 때 켜짐, 녹화 모드에선 끔)
let AC = null, lastScr = 0;
function audio() { if (REC || TEST || AC) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
function tone(f, dur, type = 'sine', g = 0.2, f2 = 0, at = 0) {
  if (!AC) return; const t = AC.currentTime + at, o = AC.createOscillator(), v = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(g, t + 0.008); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(v).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function scratch() {
  if (!AC || AC.currentTime - lastScr < 0.035) return; lastScr = AC.currentTime;
  const n = Math.round(AC.sampleRate * 0.04), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), v = AC.createGain();
  f.type = 'bandpass'; f.frequency.value = 2600 + Math.random() * 1500; f.Q.value = 1.2; v.gain.value = 0.18;
  s.buffer = buf; s.connect(f).connect(v).connect(AC.destination); s.start();
}
const SND = {
  bounce: v => tone(260 + Math.min(v, 1400) * 0.35, 0.07, 'triangle', Math.min(0.25, 0.05 + v / 5000)),
  win: () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.22, 'sine', 0.22, 0, i * 0.07)),
  miss: () => tone(240, 0.3, 'square', 0.07, 110),
  tick: () => tone(1500, 0.05, 'sine', 0.12),
  start: () => tone(660, 0.12, 'sine', 0.15, 990),
};

// ── 게임 상태
const S = { mode: 'title', clock: 0, time: ROUND, goals: 0, misses: 0, L: null, phase: 'draw', pt: 0, roll: null, stroke: null,
  best: 0, frame: 0, fx: [], pop: null, trail: [], overT: 0, lastSec: 99 };
const EV = window.__events = [];
const ev = (type, o = {}) => EV.push(Object.assign({ f: S.frame, t: +S.clock.toFixed(3), type, level: S.L ? S.L.n : 0 }, o));
try { if (!REC && !TEST) S.best = +localStorage.getItem('hanhoek-best') || 0; } catch (e) {}
function startGame() { try{window.__olHit&&window.__olHit();}catch(e){} S.mode = 'play'; S.clock = 0; S.time = ROUND; S.goals = 0; S.misses = 0; S.fx = []; S.lastSec = 99; loadLevel(1); ev('start'); SND.start(); }
function loadLevel(n) { S.L = makeLevel(n); resetTry(); S.levelT = 0; ev('level', { n }); }
function resetTry() { S.phase = 'draw'; S.pt = 0; S.roll = newRoll(S.L); S.stroke = newStroke(S.L); S.bot = null; S.trail = []; drawing = false; S.pop = null; }
function release() { if (!S.stroke.segs.length) return; S.phase = 'roll'; S.pt = 0; acc = 0; ev('release', { ink: Math.round(S.L.ink - S.stroke.ink) }); }
function endGame() {
  S.mode = 'over'; S.overT = 0; drawing = false; S.finger = null; ev('over', { goals: S.goals });
  S.newBest = S.goals > S.best;
  if (S.newBest) { S.best = S.goals; try { if (!REC && !TEST) localStorage.setItem('hanhoek-best', S.best); } catch (e) {} }
}
function burst(x, y, n, cols, sp, kind) {
  const r = rng(S.frame * 31 + n);
  for (let i = 0; i < n; i++) { const a = r() * Math.PI * 2, v = sp * (0.4 + r() * 0.8);
    S.fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * 0.6, life: 0.9 + r() * 0.5, age: 0, col: cols[i % cols.length], rot: r() * 6, vr: (r() - 0.5) * 14, kind }); }
}
let acc = 0, drawing = false;
function update(dt) {
  for (const p of S.fx) { p.age += dt; if (p.kind !== 'ring') { p.vy += 1600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; } }
  S.fx = S.fx.filter(p => p.age < p.life);
  if (S.mode === 'over') { S.overT += dt; return; }
  if (S.mode !== 'play') return;
  S.clock += dt; S.time -= dt; S.pt += dt; S.levelT += dt;
  const sec = Math.ceil(S.time); if (sec !== S.lastSec) { S.lastSec = sec; if (sec <= 5 && sec > 0) { SND.tick(); ev('tick', { s: sec }); } }
  if (S.time <= 0) { S.time = 0; endGame(); return; }
  if (S.bot) botTick(dt);
  if (S.phase === 'roll') {
    acc += dt; const all = S.L.segs.concat(S.stroke.segs);
    while (acc >= STEP) { acc -= STEP; const r = rollStep(S.roll, S.L, all), b = S.roll.b;
      if (S.roll.imp > 260) { ev('bounce', { v: Math.round(S.roll.imp) }); SND.bounce(S.roll.imp);
        if (S.roll.imp > 500) S.fx.push({ x: b.x, y: b.y, life: 0.35, age: 0, kind: 'ring' }); }
      if (r === 'win') { S.phase = 'win'; S.pt = 0; S.goals++; ev('win', { goals: S.goals }); SND.win();
        burst(S.L.cup.x, S.L.cup.y, 40, [ORANGE, BLUE, '#FFC93C', '#3CC48B', RED], 900, 'paper'); S.pop = { t: '골인!', c: BLUE }; break; }
      if (r) { S.phase = 'miss'; S.pt = 0; S.misses++; ev('miss', { why: r }); SND.miss();
        burst(b.x, b.y, 14, r === 'spike' ? [RED] : ['#9A9387'], 420, 'paper'); S.pop = { t: r === 'spike' ? '가시에 닿았어요' : '아깝다!', c: RED }; break; } }
    S.trail.push({ x: S.roll.b.x, y: S.roll.b.y }); if (S.trail.length > 16) S.trail.shift();
  } else if (S.phase === 'win' && S.pt > 0.9) loadLevel(S.L.n + 1);
  else if (S.phase === 'miss' && S.pt > 0.8) resetTry();
}

// ── 녹화용 봇: 풀이기로 찾은 한 획을 사람 손 속도로 긋는다
function botPlan() { const sol = solve(S.L, rng(SEED + S.L.n * 13 + S.misses * 101), 500, true) || S.L.sol; S.bot = { pts: sol.pts, i: 0, wait: 0.35, dur: 0.55 }; }
function botTick(dt) {
  const B = S.bot; if (S.phase !== 'draw') return;
  if ((B.wait -= dt) > 0) return;
  if (B.i === 0) { drawing = true; S.stroke.last = null; ev('draw'); }
  const to = Math.min(B.pts.length, Math.ceil(B.pts.length * Math.min(1, -B.wait / B.dur)));
  for (; B.i < to; B.i++) addPoint(S.stroke, S.L, B.pts[B.i].x, B.pts[B.i].y);
  S.finger = B.pts[Math.max(0, B.i - 1)];
  if (B.i >= B.pts.length) { drawing = false; S.finger = null; release(); }
}

// ── 그리기
function resize() {
  DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  HUD = Math.round(Math.min(H * 0.1, W * 0.19)); SC = Math.min(W / WW, (H - HUD) / WH); OX = (W - WW * SC) / 2; OY = HUD + (H - HUD - WH * SC) / 2;
}
const ease = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);
const back = x => { x = Math.min(1, Math.max(0, x)); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function text(t, x, y, px, col, wt = 700, al = 'center') { cx.fillStyle = col; cx.font = `${wt} ${px}px GM, sans-serif`; cx.textAlign = al; cx.textBaseline = 'middle'; cx.fillText(t, x, y); }
function rr(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
function paper() {
  cx.setTransform(DPR, 0, 0, DPR, 0, 0); cx.fillStyle = PAPER; cx.fillRect(0, 0, W, H);
  const lh = Math.max(22, H / 34); cx.strokeStyle = 'rgba(80,130,200,.16)'; cx.lineWidth = 1.2;
  for (let y = HUD + lh * 0.6; y < H; y += lh) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke(); }
  cx.strokeStyle = 'rgba(229,72,77,.25)'; cx.beginPath(); cx.moveTo(W * 0.07, 0); cx.lineTo(W * 0.07, H); cx.stroke();
}
function pencil(s) {   // 연필로 두세 번 그은 듯한 벽
  const j = s.j || 0;
  for (let k = 0; k < 3; k++) { const o = Math.sin(j + k * 2.1) * 2.2, q = Math.cos(j * 1.7 + k) * 2.2;
    cx.strokeStyle = k ? 'rgba(58,58,58,.55)' : '#3A3A3A'; cx.lineWidth = k ? 6 : s.t * 2; cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(s.ax + o, s.ay + q); cx.lineTo(s.bx - q, s.by + o); cx.stroke(); }
}
function spikes(s) {
  const dx = s.bx - s.ax, dy = s.by - s.ay, l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l, n = Math.max(2, Math.round(l / 24));
  cx.fillStyle = RED; cx.beginPath();
  for (let i = 0; i < n; i++) { const a = i / n * l, b = (i + 1) / n * l, m = (a + b) / 2;
    for (const sg of [1, -1]) { cx.moveTo(s.ax + ux * a, s.ay + uy * a); cx.lineTo(s.ax + ux * m - uy * 20 * sg, s.ay + uy * m + ux * 20 * sg); cx.lineTo(s.ax + ux * b, s.ay + uy * b); } }
  cx.fill(); cx.strokeStyle = '#B5262B'; cx.lineWidth = 8; cx.lineCap = 'round'; cx.beginPath(); cx.moveTo(s.ax, s.ay); cx.lineTo(s.bx, s.by); cx.stroke();
}
function cup(c, wob) {
  cx.save(); cx.translate(c.x, c.y + c.h); cx.scale(1 + wob * 0.12, 1 - wob * 0.12); cx.translate(-c.x, -c.y - c.h);
  cx.beginPath(); cx.moveTo(c.x - c.w / 2, c.y); cx.lineTo(c.x - c.w / 2 + 8, c.y + c.h); cx.lineTo(c.x + c.w / 2 - 8, c.y + c.h); cx.lineTo(c.x + c.w / 2, c.y);
  cx.fillStyle = 'rgba(47,111,219,.14)'; cx.fill(); cx.strokeStyle = BLUE; cx.lineWidth = 18; cx.lineJoin = 'round'; cx.lineCap = 'round'; cx.stroke();
  const fx = c.x + c.w / 2; cx.lineWidth = 6; cx.beginPath(); cx.moveTo(fx, c.y); cx.lineTo(fx, c.y - 100); cx.stroke();
  cx.fillStyle = '#FFC93C'; cx.beginPath(); cx.moveTo(fx, c.y - 100); cx.lineTo(fx - 62, c.y - 80); cx.lineTo(fx, c.y - 60); cx.closePath(); cx.fill();
  cx.restore();
}
function ball(b, look) {
  cx.fillStyle = ORANGE; cx.strokeStyle = '#C9550A'; cx.lineWidth = 4; cx.beginPath(); cx.arc(b.x, b.y, BR, 0, 7); cx.fill(); cx.stroke();
  cx.fillStyle = 'rgba(255,255,255,.7)'; cx.beginPath(); cx.arc(b.x - 9, b.y - 10, 6, 0, 7); cx.fill();
  const l = Math.hypot(look.x, look.y) || 1, ex = look.x / l * 6, ey = look.y / l * 6;
  cx.fillStyle = INK; for (const s of [-1, 1]) { cx.beginPath(); cx.arc(b.x + ex + s * 8, b.y + ey - 2, 4, 0, 7); cx.fill(); }
}
function retryBtn() { const r = HUD * 0.3; return { x: W - r - 16, y: HUD / 2, r }; }
function render() {
  paper();
  if (S.mode === 'title') return titleScreen();
  const L = S.L, B = retryBtn();
  // HUD
  text('골인', 18, HUD * 0.32, HUD * 0.2, '#6B6458', 500, 'left'); text(String(S.goals), 18, HUD * 0.68, HUD * 0.4, INK, 700, 'left');
  const low = S.time < 10, pw = HUD * 1.7; cx.fillStyle = low ? RED : INK; rr(W / 2 - pw / 2, HUD * 0.2, pw, HUD * 0.6, HUD * 0.3); cx.fill();
  text(Math.ceil(S.time) + '초', W / 2, HUD * 0.52, HUD * 0.32, '#fff');

  const inkK = S.stroke.ink / L.ink; cx.fillStyle = inkK < 0.2 ? RED : INK; rr(118, 32, Math.max(24, 640 * inkK), 24, 12); cx.fill();
  text('레벨 ' + L.n, 960, 44, 34, INK, 700, 'right');
  if (S.phase === 'draw') { cx.setLineDash([10, 12]); cx.strokeStyle = 'rgba(27,35,64,.3)'; cx.lineWidth = 3; cx.beginPath(); cx.arc(L.ball.x, L.ball.y, BR + 34, 0, 7); cx.stroke(); cx.setLineDash([]); }
  for (const s of L.segs) if (s.k === 'wall') pencil(s); else if (s.k === 'spike') spikes(s);

    cx.fillStyle = 'rgba(255,255,255,.85)'; cx.strokeStyle = INK; cx.lineWidth = 4; cx.beginPath(); cx.arc(S.finger.x, S.finger.y, 30, 0, 7); cx.fill(); cx.stroke(); }

function button(label, y, col) { const w = Math.min(W * 0.62, 420), h = Math.min(W * 0.16, 96); cx.fillStyle = col; rr(W / 2 - w / 2, y - h / 2, w, h, h / 2); cx.fill();

// ── 입력
function toWorld(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - OX) / SC, y: (e.clientY - r.top - OY) / SC }; }
const inBtn = (e, b) => b && e.clientX >= b.x && e.clientX <= b.x + b.w && e.clientY >= b.y - 10 && e.clientY <= b.y + b.h + 10;
