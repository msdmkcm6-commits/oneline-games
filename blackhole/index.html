<body><canvas id="c"></canvas><script>
// 블랙홀 키우기 — v3: HUD (G마켓 산스), size comparisons, level-up toasts, start/end screens, best score, sound, touch hints
(() => {
'use strict';
const Q = new URLSearchParams(location.search);
const RECORD = Q.has('record');
let seed = +(Q.get('seed') || 7);
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { DPR = RECORD ? 1 : Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', resize); resize();

// ---- kinds by absolute radius (metres) ----
const KINDS = [
  { id: 'dust', name: '먼지', max: 0.15 },
  { id: 'rock', name: '돌멩이', max: 3 },
  { id: 'sat', name: '인공위성', max: 40 },
  { id: 'aster', name: '소행성', max: 4e4 },
  { id: 'moon', name: '위성', max: 2.5e6 },
  { id: 'planet', name: '행성', max: 8e7 },
  { id: 'star', name: '별', max: Infinity },
];
const kindOf = r => KINDS.find(k => r < k.max);
const PAL = {
  dust: ['#8A8F98', '#6E737C', '#A7ACB4'], rock: ['#8C7B6B', '#6F655B', '#A39484'], sat: ['#C9CED6', '#9AA0A6'],
  aster: ['#7D6E62', '#5E554D', '#93857A'], moon: ['#B8B8B4', '#9C9C98', '#D0CFCB'],
  planet: [['#3D7BD9', '#86B7FF'], ['#D9733D', '#FFC08A'], ['#53B37A', '#C9F2D4'], ['#C9A35A', '#F2DDA9'], ['#9D6BD9', '#D7BEFF'], ['#3DB8C9', '#B4F1F7']],
  star: [['#FFD45A', '#FFF4C2'], ['#FF8A3D', '#FFD2A8'], ['#9EC8FF', '#EEF6FF'], ['#FF5E4D', '#FFC2B8']],
};
const pick = a => a[Math.floor(rnd() * a.length)];

const ROUND = 60;
const GROW = +(Q.get('grow') || 0.24);  // size gained per swallow = GROW x (swallowed size / hole size)
const P = { x: 0, y: 0, r: 0.5, spin: 0, pulse: 0 };
let objs = [], parts = [], time = 0, zoom = 1, camX = 0, camY = 0, aim = null, over = false, frame = 0, shake = 0;
let started = false, toast = null, best = 0, eats = 0, overAt = 0;
try { best = +localStorage.getItem('bh-best') || 0; } catch (e) {}
window.__events = [];
const stars = Array.from({ length: 220 }, () => ({ x: rnd(), y: rnd(), d: 0.2 + rnd() * 0.8, s: rnd() < 0.08 ? 2 : 1 }));

function makeObj(x, y, r) {
  const k = kindOf(r), sp = r * (0.15 + rnd() * 0.35), da = rnd() * Math.PI * 2;
  const o = { x, y, r, k: k.id, vx: Math.cos(da) * sp, vy: Math.sin(da) * sp, rot: rnd() * 6.28, vr: (rnd() - 0.5) * 0.8 };
  if (k.id === 'planet' || k.id === 'star') o.col = pick(PAL[k.id]); else o.col = pick(PAL[k.id]);
  if (k.id === 'dust' || k.id === 'rock' || k.id === 'aster') {          // lumpy outline
    const n = 9 + Math.floor(rnd() * 5); o.shape = Array.from({ length: n }, () => 0.72 + rnd() * 0.32);
  }
  if (k.id === 'moon') o.craters = Array.from({ length: 5 }, () => [rnd() * 1.4 - 0.7, rnd() * 1.4 - 0.7, 0.1 + rnd() * 0.2]);
  if (k.id === 'planet') { o.ring = rnd() < 0.3; o.bands = 2 + Math.floor(rnd() * 4); }
  return o;
}
function viewHalf() { return Math.hypot(W, H) / 2 / zoom; }
function spawn(inView) {
  const vh = viewHalf(), a = rnd() * Math.PI * 2;
  const d = inView ? P.r * 3 + rnd() * vh * 1.3 : vh * (1.05 + rnd() * 1.0);
  const u = rnd();                     // size relative to the hole: mostly edible, some threats
  const rel = u < 0.72 ? 0.18 + rnd() * 0.62 : u < 0.86 ? 0.04 + rnd() * 0.14 : 1.0 + rnd() * 1.6;
  objs.push(makeObj(P.x + Math.cos(a) * d, P.y + Math.sin(a) * d, P.r * rel));
}
function targetZoom() { return Math.min(W, H) * 0.075 / P.r; }
zoom = targetZoom();
for (let i = 0; i < 95; i++) spawn(true);

function burst(o) {
  const n = 10 + Math.min(18, Math.round(o.r / P.r * 30));
  const base = o.col.length === 2 && Array.isArray(o.col) ? o.col : [o.col, '#C8FF2E'];
  for (let i = 0; i < n; i++) {
    const a = rnd() * 6.28, d = o.r * (0.3 + rnd());
    parts.push({ x: o.x + Math.cos(a) * d, y: o.y + Math.sin(a) * d, a: Math.atan2(o.y - P.y, o.x - P.x) + (rnd() - 0.5),
      d: Math.hypot(o.x - P.x, o.y - P.y) + d, life: 0, max: 0.45 + rnd() * 0.35, c: Array.isArray(base) ? base[i % 2] : base, s: 2 + rnd() * 4 });
  }
}

function step(dt) {
  if (over || !started) return;
  time += dt; frame++; if (toast) { toast.t += dt; if (toast.t > 1.8) toast = null; }
  if (time >= ROUND) { over = true; overAt = performance.now(); window.__events.push({ f: frame, t: time, type: 'end', r: P.r });
    if (P.r * 2 > best) { best = P.r * 2; try { localStorage.setItem('bh-best', best); } catch (e) {} } return; }
  P.spin += dt * 1.6; P.pulse = Math.max(0, P.pulse - dt * 2.5); shake = Math.max(0, shake - dt * 3);
  if (aim) {
    const dx = aim.x - W / 2, dy = aim.y - H / 2, l = Math.hypot(dx, dy);
    if (l > 4) { const s = P.r * 5.2 * Math.min(1, l / 120); P.x += dx / l * s * dt; P.y += dy / l * s * dt; }
  }
  for (const o of objs) {
    o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.vr * dt;
    const dx = P.x - o.x, dy = P.y - o.y, d = Math.hypot(dx, dy) || 1e-9;
    if (o.r < P.r * 0.9) {
      if (d < P.r * 3.2) { const pull = P.r * 1.8 * (1 - d / (P.r * 3.2)); o.x += dx / d * pull * dt; o.y += dy / d * pull * dt; }
      if (d < P.r + o.r * 0.2) {
        const before = kindOf(P.r * 0.85).id;
        // grow by a fraction of the swallowed body's relative size (steady, low-variance); slows beyond Sun size
        P.r *= 1 + GROW * (o.r / P.r) * (P.r > 2e9 ? Math.min(1, 2e9 / P.r) : 1); if (!isFinite(P.r)) P.r = 1e12; o.dead = true; P.pulse = Math.min(1, P.pulse + 0.5); burst(o);
        window.__events.push({ f: frame, t: +time.toFixed(3), type: 'eat', r: P.r, or: o.r, k: o.k });
        const after = kindOf(P.r * 0.85).id;
        eats++; gulp(o.r / P.r);
        if (after !== before) { window.__events.push({ f: frame, t: +time.toFixed(3), type: 'tier', k: after }); toast = { k: after, t: 0 }; }
      }
    } else if (d < P.r + o.r) {
      const push = (P.r + o.r - d); P.x += dx / d * push; P.y += dy / d * push; shake = 0.5;
    }
  }
  for (const p of parts) { p.life += dt; p.a += dt * 6; p.d *= Math.pow(0.02, dt / p.max); p.x = P.x + Math.cos(p.a) * p.d; p.y = P.y + Math.sin(p.a) * p.d; }
  parts = parts.filter(p => p.life < p.max);
  const vh = viewHalf();
  objs = objs.filter(o => !o.dead && Math.hypot(o.x - P.x, o.y - P.y) < vh * 2.6 && o.r > P.r * 0.025);
  while (objs.length < 95) spawn(false);
  zoom += (targetZoom() - zoom) * Math.min(1, dt * 2.2);
  camX = P.x; camY = P.y;
}

// ---- drawing ----
function drawObj(o, X, Y, R) {
  cx.save(); cx.translate(X, Y); if (o.k !== 'planet') cx.rotate(o.rot);
  const edible = o.r < P.r * 0.9;
  if (o.k === 'star') {
    const g = cx.createRadialGradient(0, 0, R * 0.2, 0, 0, R * 2.4);
    g.addColorStop(0, o.col[1]); g.addColorStop(0.4, o.col[0]); g.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = g; cx.beginPath(); cx.arc(0, 0, R * 2.4, 0, 7); cx.fill();
    cx.fillStyle = o.col[1]; cx.beginPath(); cx.arc(0, 0, R, 0, 7); cx.fill();
  } else if (o.k === 'planet') {
    const g = cx.createLinearGradient(0, -R, 0, R);
    for (let i = 0; i <= o.bands * 2; i++) g.addColorStop(i / (o.bands * 2), i % 2 ? o.col[1] : o.col[0]);
    cx.fillStyle = g; cx.beginPath(); cx.arc(0, 0, R, 0, 7); cx.fill();
    shade(R);
    if (o.ring) { cx.strokeStyle = o.col[1]; cx.globalAlpha = 0.7; cx.lineWidth = Math.max(1, R * 0.12);
      cx.beginPath(); cx.ellipse(0, 0, R * 1.8, R * 0.45, 0.3, 0, 7); cx.stroke(); cx.globalAlpha = 1; }
  } else if (o.k === 'moon') {
    cx.fillStyle = o.col; cx.beginPath(); cx.arc(0, 0, R, 0, 7); cx.fill();
    cx.fillStyle = 'rgba(0,0,0,0.18)'; for (const [a, b, s] of o.craters) { cx.beginPath(); cx.arc(a * R, b * R, s * R, 0, 7); cx.fill(); }
    shade(R);
  } else if (o.k === 'sat') {
    cx.fillStyle = '#5B8DEF'; cx.fillRect(-R, -R * 0.22, R * 0.62, R * 0.44); cx.fillRect(R * 0.38, -R * 0.22, R * 0.62, R * 0.44);
    cx.fillStyle = o.col; cx.fillRect(-R * 0.36, -R * 0.36, R * 0.72, R * 0.72);
    cx.fillStyle = '#C8FF2E'; cx.fillRect(-R * 0.08, -R * 0.55, R * 0.16, R * 0.2);
  } else {
    cx.fillStyle = o.col; cx.beginPath();
    o.shape.forEach((s, i) => { const a = i / o.shape.length * 6.283; cx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * R * s, Math.sin(a) * R * s); });
    cx.closePath(); cx.fill(); shade(R * 0.9);
  }
  cx.restore();
  if (!edible && R > 6) {                    // threat marker: thin red ring
    cx.strokeStyle = 'rgba(255,94,77,0.85)'; cx.lineWidth = 3; cx.setLineDash([10, 8]);
    cx.beginPath(); cx.arc(X, Y, R * (o.k === 'star' ? 1.15 : 1.12) + 4, 0, 7); cx.stroke(); cx.setLineDash([]);
  }
}
function shade(R) {
  const g = cx.createRadialGradient(-R * 0.4, -R * 0.4, R * 0.1, 0, 0, R * 1.05);
  g.addColorStop(0, 'rgba(255,255,255,0.18)'); g.addColorStop(0.6, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.45)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(0, 0, R, 0, 7); cx.fill();
}
function drawHole() {
  const R = P.r * zoom, X = W / 2 + (rnd() - 0.5) * shake * 10, Y = H / 2 + (rnd() - 0.5) * shake * 10;
  const glow = cx.createRadialGradient(X, Y, R * 0.9, X, Y, R * (2.6 + P.pulse));
  glow.addColorStop(0, 'rgba(200,255,46,0.55)'); glow.addColorStop(0.25, 'rgba(255,170,60,0.25)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
  cx.fillStyle = glow; cx.beginPath(); cx.arc(X, Y, R * (2.6 + P.pulse), 0, 7); cx.fill();
  cx.save(); cx.translate(X, Y); cx.rotate(P.spin);          // swirling accretion arcs
  for (let i = 0; i < 3; i++) {
    cx.strokeStyle = i === 1 ? 'rgba(255,190,90,0.75)' : 'rgba(200,255,46,0.8)'; cx.lineWidth = Math.max(2, R * 0.09);
    cx.beginPath(); cx.arc(0, 0, R * (1.25 + i * 0.2), i * 2.1, i * 2.1 + 2.2); cx.stroke();
  }
  cx.restore();
  cx.fillStyle = '#000'; cx.beginPath(); cx.arc(X, Y, R, 0, 7); cx.fill();
  cx.strokeStyle = 'rgba(255,255,255,0.9)'; cx.lineWidth = Math.max(1.5, R * 0.04); cx.beginPath(); cx.arc(X, Y, R * 1.04, 0, 7); cx.stroke();
}
function draw() {
  cx.fillStyle = '#0E0F12'; cx.fillRect(0, 0, W, H);
  const neb = cx.createRadialGradient(W * 0.3, H * 0.25, 0, W * 0.3, H * 0.25, H * 0.7);
  neb.addColorStop(0, 'rgba(70,60,140,0.18)'); neb.addColorStop(1, 'rgba(0,0,0,0)'); cx.fillStyle = neb; cx.fillRect(0, 0, W, H);
  for (const s of stars) {                   // parallax starfield (screen space, wraps)
    const px = ((s.x * W - camX * zoom * 0.02 * s.d) % W + W) % W, py = ((s.y * H - camY * zoom * 0.02 * s.d) % H + H) % H;
    cx.fillStyle = `rgba(255,255,255,${0.25 + s.d * 0.5})`; cx.fillRect(px, py, s.s, s.s);
  }
  const sx = x => (x - camX) * zoom + W / 2, sy = y => (y - camY) * zoom + H / 2;
  for (const o of objs) { const R = Math.max(1.2, o.r * zoom), X = sx(o.x), Y = sy(o.y);
    if (X < -R * 3 || X > W + R * 3 || Y < -R * 3 || Y > H + R * 3) continue; drawObj(o, X, Y, R); }
  for (const p of parts) { cx.globalAlpha = 1 - p.life / p.max; cx.fillStyle = p.c; cx.beginPath(); cx.arc(sx(p.x), sy(p.y), p.s, 0, 7); cx.fill(); }
  cx.globalAlpha = 1;
  drawHole();
  drawHud();
}

// ---- HUD, screens (G마켓 산스) ----
const LIME = '#C8FF2E', BG = '#0E0F12', GRAY = '#9AA0A6';
const REFS = [ // diameters in metres (rounded public figures)
  ['축구공', 0.22], ['사람 키', 1.7], ['버스', 12], ['축구장', 105], ['롯데월드타워 높이', 555], ['제주도 동서 길이', 73e3],
  ['달', 3.474e6], ['지구', 1.2742e7], ['목성', 1.3982e8], ['태양', 1.3927e9]];
const TIERS = { dust: '먼지', rock: '돌멩이', sat: '인공위성', aster: '소행성', moon: '위성', planet: '행성', star: '별' };
function fmt(m) {
  if (m < 1) return (m * 100).toFixed(0) + ' cm';
  if (m < 1000) return m.toFixed(m < 10 ? 1 : 0) + ' m';
  const km = m / 1000;
  if (km < 10) return km.toFixed(2) + ' km';
  if (km < 1e4) return Math.round(km).toLocaleString('ko-KR') + ' km';
  if (km < 1e8) return (km / 1e4).toFixed(km < 1e5 ? 1 : 0) + '만 km';
  return (km / 1e8).toFixed(1) + '억 km';
}
function compare(m) {
  let ref = REFS[0]; for (const r of REFS) if (m >= r[1] * 0.95) ref = r;
  const k = m / ref[1]; return `${ref[0]} ${k < 9.95 ? k.toFixed(1) : Math.round(k).toLocaleString('ko-KR')}개 크기`;
}
function pill(x, y, text, fs, bg, fg) {
  cx.font = `500 ${fs}px GM, sans-serif`; const w = cx.measureText(text).width + fs * 1.3, h = fs * 1.9;
  cx.fillStyle = bg; rr(x - w / 2, y - h / 2, w, h, h / 2); cx.fill(); cx.fillStyle = fg; cx.textBaseline = 'middle'; cx.fillText(text, x, y + fs * 0.05);
}
function rr(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
function drawHud() {
  const u = Math.min(W, H / 1.6) / 100;                  // layout unit (portrait friendly)
  cx.textAlign = 'center'; cx.textBaseline = 'alphabetic';
  if (started) {
    const left = Math.max(0, ROUND - time), m = u * 5, bw = W - m * 2;
    cx.fillStyle = 'rgba(255,255,255,0.12)'; rr(m, u * 4, bw, u * 1.4, u * 0.7); cx.fill();
    cx.fillStyle = left < 10 ? '#FF5E4D' : LIME; rr(m, u * 4, Math.max(u * 1.4, bw * left / ROUND), u * 1.4, u * 0.7); cx.fill();
    cx.font = `500 ${u * 3.4}px GM, sans-serif`; cx.fillStyle = GRAY; cx.textAlign = 'left'; cx.fillText(`남은 시간 ${Math.ceil(left)}초`, m, u * 10.5);
    cx.textAlign = 'right'; cx.fillText(`꿀꺽 ${eats}`, W - m, u * 10.5); cx.textAlign = 'center';
    cx.font = `700 ${u * 9}px GM, sans-serif`; cx.fillStyle = '#fff'; cx.fillText(fmt(P.r * 2), W / 2, u * 21.5);
    pill(W / 2, u * 27.5, compare(P.r * 2), u * 3.4, 'rgba(14,15,18,0.75)', LIME);
    if (toast) {
      const a = Math.min(1, toast.t * 5) * Math.min(1, (1.8 - toast.t) * 3), y = H * 0.68;
      cx.globalAlpha = a; pill(W / 2, y, `레벨 업! 이제 ${TIERS[toast.k]}도 꿀꺽`, u * 4.6, LIME, BG); cx.globalAlpha = 1;
    }
    if (time < 4 && !RECORD) { cx.globalAlpha = Math.min(1, (4 - time)); pill(W / 2, H - u * 12, '가고 싶은 쪽을 누르고 있으세요', u * 3.6, 'rgba(255,255,255,0.12)', '#fff'); cx.globalAlpha = 1; }
  }
  if (!started) screen('블랙홀 키우기', ['나보다 작은 건 전부 삼켜서 커지세요', '빨간 점선은 아직 너무 커요', '60초 안에 조약돌에서 별까지!'], '터치해서 시작', best ? `최고 기록 ${fmt(best)}` : '');
  if (over) screen('60초 끝!', [`최종 지름 ${fmt(P.r * 2)}`, compare(P.r * 2), `꿀꺽 ${eats}번`], '다시 하기', `최고 기록 ${fmt(best)}`);
}
function screen(title, lines, btn, foot) {
  const u = Math.min(W, H / 1.6) / 100;
  cx.fillStyle = 'rgba(14,15,18,0.82)'; cx.fillRect(0, 0, W, H);
  cx.textAlign = 'center'; cx.fillStyle = LIME; cx.font = `700 ${u * 11}px GM, sans-serif`; cx.fillText(title, W / 2, H * 0.36);
  cx.font = `500 ${u * 4.4}px GM, sans-serif`; lines.forEach((l, i) => { cx.fillStyle = i === 0 && over ? '#fff' : '#D7DAE0'; cx.fillText(l, W / 2, H * 0.44 + i * u * 7); });
  pill(W / 2, H * 0.66, btn, u * 5.2, LIME, BG);
  if (foot) { cx.font = `500 ${u * 3.4}px GM, sans-serif`; cx.fillStyle = GRAY; cx.textBaseline = 'alphabetic'; cx.fillText(foot, W / 2, H * 0.74); }
}

// ---- sound (WebAudio synth, no files) ----
let ac = null;
function gulp(rel) {
  if (!ac || RECORD) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(260 + rel * 200, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.16);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18 * Math.min(1, 0.4 + rel), t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.22);
}
function start() { try{window.__olHit&&window.__olHit();}catch(e){}
  P.r = 0.5; P.x = P.y = 0; objs = []; parts = []; time = 0; eats = 0; over = false; frame = 0; toast = null;
  zoom = targetZoom(); for (let i = 0; i < 95; i++) spawn(true); started = true;
}

cv.addEventListener('pointerdown', e => {
  if (!ac && !RECORD) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {} }
  if (!started || (over && performance.now() - overAt > 1000)) { start(); aim = null; return; }
  if (over) return;
  aim = { x: e.clientX, y: e.clientY };
});
cv.addEventListener('pointermove', e => { if (aim || e.pointerType === 'mouse') aim = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') aim = null; });

window.__state = () => ({ P, objs, time, over, zoom, W, H });
window.__setAim = (x, y) => { aim = { x, y }; };
window.__step = dt => { step(dt); draw(); };
window.__start = () => start();
if (!RECORD) { let last = performance.now(); const loop = now => { step(Math.min(0.05, (now - last) / 1000)); last = now; draw(); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
else draw();
})();

</script></body></html>
