<script>
// 한 줄 제작소 #10 '한 줄 비트' — 곡을 코드로 작곡하고, 그 곡에서 노트를 뽑아 치는 리듬 게임
(function () {
  const BPM = 120, BEAT = 60 / BPM, BARS = 32, LEAD = 2.0; // LEAD: 노트가 판정선까지 내려오는 시간(초)
  const SONG_LEN = BARS * 4 * BEAT + 2;
  const KEYS = ['d', 'f', 'j', 'k'];
  const LANE_COL = ['#C8FF2E', '#5CE1FF', '#FF6FB5', '#FFC94D'];
  const JUDGE = [['PERFECT', 0.045, 300], ['GREAT', 0.09, 200], ['GOOD', 0.14, 100]];
  const REC = /[?&]rec/.test(location.search);

  // ---------- 작곡: 씨앗 하나로 같은 곡이 나오게 ----------
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]]; // Am F C G (미디 번호)
  const SCALE = [0, 2, 3, 5, 7, 8, 10]; // A 자연단음계 (A=57 기준 반음)
  function compose(seed) {
    const r = rng(seed), song = { drums: [], bass: [], lead: [], pad: [], sec: [] };
    const motif = (len) => { const m = []; let t = 0; while (t < len) { const d = [0.5, 0.5, 1, 0.25, 0.75][Math.floor(r() * 5)]; if (t + d > len) break; m.push([t, d, Math.floor(r() * 5) - 2]); t += d; } return m; };
    const mA = motif(4), mB = motif(4), mB2 = motif(4);
    const section = b => b < 4 ? 'intro' : b < 12 ? 'verse' : b < 20 ? 'chorus' : b < 24 ? 'break' : b < 31 ? 'chorus' : 'end';
    let deg = 4;
    for (let b = 0; b < BARS; b++) {
      const sec = section(b), t0 = b * 4 * BEAT, ch = CHORDS[b % 4];
      if (b === 0 || section(b - 1) !== sec) song.sec.push([t0, sec]);
      // 드럼
      for (let q = 0; q < 8; q++) {
        const t = t0 + q * BEAT / 2;
        if (sec === 'end' && q > 0) break;
        if (sec !== 'break' && q % 2 === 0 && (q % 4 === 0 || sec === 'chorus')) song.drums.push([t, 'kick']);
        if (sec !== 'intro' && q % 4 === 2) song.drums.push([t, 'snare']);
        if (sec !== 'end' && (sec !== 'intro' || b >= 2)) song.drums.push([t, 'hat', q % 2 ? 0.25 : 0.5]);
      }
      if (sec === 'break' && b === 23) for (let q = 0; q < 8; q++) song.drums.push([t0 + 2 * BEAT + q * BEAT / 4, 'snare']); // 필인
      // 베이스·패드
      if (sec !== 'intro' && sec !== 'end') for (let q = 0; q < 4; q++) song.bass.push([t0 + q * BEAT, BEAT * 0.9, ch[0] - 24 + (q === 3 && sec === 'chorus' ? 7 : 0)]);
      song.pad.push([t0, sec === 'end' ? 3 : 4 * BEAT, ch]);
      // 멜로디: 절은 동기 A, 후렴은 동기 B(4마디째마다 변형), 코드음 쪽으로 끌어당김
      if (sec === 'verse' || sec === 'chorus') {
        const m = sec === 'verse' ? mA : (b % 4 === 3 ? mB2 : mB);
        for (const [mt, md, step] of m) {
          deg = Math.max(0, Math.min(11, deg + step));
          if (mt === 0) { const target = [0, 5, 2, 6][b % 4] + (sec === 'chorus' ? 7 : 0); deg = Math.round((deg + target) / 2); }
          const oct = Math.floor(deg / 7), note = 57 + 12 + SCALE[deg % 7] + 12 * oct - (sec === 'verse' ? 12 : 0);
          song.lead.push([t0 + mt * BEAT, md * BEAT * 0.95, note]);
        }
      }
      if (sec === 'end') song.lead.push([t0, 2.5, 69 + 12]);
    }
    return song;
  }

  // ---------- 노트 뽑기: 멜로디 음높이 → 줄, 인트로·간주는 드럼 → 줄 ----------
  function chart(song, hard) {
    const notes = []; let last = -1, lastT = -9;
    const push = (t, lane) => { if (t - lastT < (hard ? 0.12 : 0.24)) return; if (lane === last && t - lastT < 0.3) lane = (lane + 1) % 4; notes.push({ t, lane, hit: 0 }); last = lane; lastT = t; };
    const ev = [];
    for (const [t, , n] of song.lead) ev.push([t, 'lead', n]);
    for (const [t, k] of song.drums) if (k !== 'hat') ev.push([t, k]);
    ev.sort((a, b) => a[0] - b[0]);
    let lo = 999, hi = 0; for (const [, , n] of song.lead) { lo = Math.min(lo, n); hi = Math.max(hi, n); }
    const secAt = t => { let s = 'intro'; for (const [st, n] of song.sec) if (st <= t + 1e-6) s = n; return s; };
    for (const [t, k, n] of ev) {
      const s = secAt(t);
      if (k === 'lead') { const nn = n < 69 ? n + 12 : n; push(t, Math.min(3, Math.floor((nn - Math.max(69, lo)) / ((hi - Math.max(69, lo) + 1) / 4)))); }
      else if (s === 'intro' || s === 'break' || (hard && k === 'kick' && s === 'chorus')) push(t, k === 'kick' ? (notes.length % 2 ? 0 : 3) : (notes.length % 2 ? 1 : 2));
    }
    return notes.sort((a, b) => a.t - b.t);
  }

  // ---------- 합성(실시간·오프라인 같은 함수) ----------
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function synth(ac, song, t0, dest) {
    const out = ac.createGain(); out.gain.value = 0.8; out.connect(dest);
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(out);
    const noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const nd = noise.getChannelData(0); const nr = rng(7); for (let i = 0; i < nd.length; i++) nd[i] = nr() * 2 - 1;
    const env = (g, t, a, peak, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
    for (const [t, k, v] of song.drums) {
      const T = t0 + t;
      if (k === 'kick') { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, T); o.frequency.exponentialRampToValueAtTime(42, T + 0.12); env(g, T, 0.002, 0.9, 0.28); o.connect(g).connect(comp); o.start(T); o.stop(T + 0.32); }
      else { const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noise; f.type = k === 'hat' ? 'highpass' : 'bandpass'; f.frequency.value = k === 'hat' ? 7000 : 1800; env(g, T, 0.001, k === 'hat' ? 0.12 * (v || 0.5) * 2 : 0.5, k === 'hat' ? 0.04 : 0.16); s.connect(f).connect(g).connect(comp); s.start(T, nr() * 0.5); s.stop(T + 0.25); }
    }
    for (const [t, d, n] of song.bass) { const T = t0 + t, o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = mtof(n); f.type = 'lowpass'; f.frequency.setValueAtTime(900, T); f.frequency.exponentialRampToValueAtTime(180, T + d); env(g, T, 0.01, 0.28, d); o.connect(f).connect(g).connect(comp); o.start(T); o.stop(T + d + 0.05); }
    for (const [t, d, ch] of song.pad) for (const n of ch) { const T = t0 + t, o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.value = mtof(n); o.detune.value = (n % 3 - 1) * 6; g.gain.setValueAtTime(0.0001, T); g.gain.linearRampToValueAtTime(0.05, T + 0.3); g.gain.linearRampToValueAtTime(0.0001, T + d); o.connect(g).connect(comp); o.start(T); o.stop(T + d + 0.05); }
    for (const [t, d, n] of song.lead) { const T = t0 + t, o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter(); o.type = 'square'; o2.type = 'triangle'; o.frequency.value = o2.frequency.value = mtof(n); o2.detune.value = 7; f.type = 'lowpass'; f.frequency.value = 2600; env(g, T, 0.008, 0.13, Math.max(0.1, d)); o.connect(f); o2.connect(f); f.connect(g).connect(comp); o.start(T); o2.start(T); o.stop(T + d + 0.1); o2.stop(T + d + 0.1); }
  }

  // ---------- 상태 ----------
  const cv = document.getElementById('c'), cx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
  addEventListener('resize', resize); resize();
  const G = { st: 'title', seed: 10, hard: false, song: null, notes: [], t: 0, score: 0, combo: 0, maxc: 0, cnt: [0, 0, 0, 0], fx: [], flash: [0, 0, 0, 0], judge: null, ac: null, start: 0, best: +(localStorage.getItem('ep10-best') || 0) };
  function newSong() { G.song = compose(G.seed); G.notes = chart(G.song, G.hard); }
  newSong();
  function begin() {
    newSong(); Object.assign(G, { st: 'play', score: 0, combo: 0, maxc: 0, cnt: [0, 0, 0, 0], fx: [], judge: null, t: -LEAD });
    if (!REC) { G.ac = G.ac || new (window.AudioContext || window.webkitAudioContext)(); G.ac.resume(); G.start = G.ac.currentTime + LEAD; synth(G.ac, G.song, G.start, G.ac.destination); if (window.__olHit) window.__olHit(); }
  }
  const now = () => REC || !G.ac ? G.t : G.ac.currentTime - G.start;
  function hitLane(l) {
    if (G.st !== 'play') return; G.flash[l] = 1; const t = now();
    let best = null; for (const n of G.notes) { if (n.hit || n.lane !== l) continue; const d = Math.abs(n.t - t); if (d <= JUDGE[2][1] && (!best || d < Math.abs(best.t - t))) best = n; if (n.t > t + 0.2) break; }
    if (!best) return;
    const d = Math.abs(best.t - t), j = JUDGE.findIndex(x => d <= x[1]);
    best.hit = 1; G.cnt[j]++; G.combo++; G.maxc = Math.max(G.maxc, G.combo);
    G.score += JUDGE[j][2] + Math.min(G.combo, 100) * 2; G.judge = [JUDGE[j][0], t, j];
    for (let i = 0; i < 14; i++) G.fx.push({ x: laneX(l), y: hitY(), vx: (Math.random() - 0.5) * 420, vy: -Math.random() * 520, life: 0.5, c: LANE_COL[l] });
  }
  function miss(n) { n.hit = 2; G.cnt[3]++; G.combo = 0; G.judge = ['MISS', n.t, 3]; }
  function step(dt) {
    if (G.st !== 'play') return;
    if (REC) G.t += dt; else G.t = now();
    for (const n of G.notes) { if (n.t > G.t) break; if (!n.hit && G.t - n.t > JUDGE[2][1]) miss(n); }
    for (const f of G.fx) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 1200 * dt; f.life -= dt; }
    G.fx = G.fx.filter(f => f.life > 0); for (let l = 0; l < 4; l++) G.flash[l] = Math.max(0, G.flash[l] - dt * 5);
    if (G.t > SONG_LEN) { G.st = 'over'; if (G.score > G.best) { G.best = G.score; try { localStorage.setItem('ep10-best', G.best); } catch (e) { } } }
  }
  const total = () => G.notes.length;
  const acc = () => { const n = G.cnt[0] + G.cnt[1] + G.cnt[2] + G.cnt[3]; return n ? (G.cnt[0] + G.cnt[1] * 0.7 + G.cnt[2] * 0.4) / n : 1; };
  const rank = a => a >= 0.95 ? 'S' : a >= 0.88 ? 'A' : a >= 0.75 ? 'B' : a >= 0.6 ? 'C' : 'D';

  // ---------- 그리기 ----------
  const laneW = () => Math.min(110, W * 0.21), laneX = l => W / 2 + (l - 1.5) * laneW(), hitY = () => H * 0.82;
  function txt(s, x, y, size, col, w = 700, al = 'center') { cx.font = `${w} ${size}px GM, sans-serif`; cx.textAlign = al; cx.fillStyle = col; cx.fillText(s, x, y); }
  function beatPulse() { const t = Math.max(0, now()); return Math.pow(1 - (t / BEAT) % 1, 3); }
  function draw() {
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx.fillStyle = '#0E0F12'; cx.fillRect(0, 0, W, H);
    const lw = laneW(), x0 = laneX(0) - lw / 2, p = G.st === 'play' ? beatPulse() : 0;
    // 배경 격자(박자에 맞춰 숨쉼)
    cx.strokeStyle = `rgba(200,255,46,${0.04 + p * 0.06})`; cx.lineWidth = 1;
    for (let y = (now() * 300) % 60; y < H; y += 60) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke(); }
    for (let l = 0; l < 4; l++) {
      const x = x0 + l * lw; cx.fillStyle = l % 2 ? '#15171c' : '#121418'; cx.fillRect(x, 0, lw, H);
      if (G.flash[l] > 0) { const g = cx.createLinearGradient(0, hitY(), 0, hitY() - 300); g.addColorStop(0, LANE_COL[l] + '66'); g.addColorStop(1, LANE_COL[l] + '00'); cx.globalAlpha = G.flash[l]; cx.fillStyle = g; cx.fillRect(x, hitY() - 300, lw, 300); cx.globalAlpha = 1; }
    }
    cx.fillStyle = `rgba(255,255,255,${0.5 + p * 0.5})`; cx.fillRect(x0, hitY() - 2, lw * 4, 4);
    for (let l = 0; l < 4; l++) { cx.strokeStyle = LANE_COL[l]; cx.lineWidth = 3; cx.beginPath(); cx.arc(laneX(l), hitY(), lw * 0.32, 0, 7); cx.stroke(); txt(KEYS[l].toUpperCase(), laneX(l), hitY() + lw * 0.55 + 14, 16, '#ffffff55', 500); }
    // 노트
    const t = now(), sp = (hitY() + 40) / LEAD;
    for (const n of G.notes) {
      if (n.hit === 1) continue; const y = hitY() - (n.t - t) * sp; if (y < -40) break; if (y > H + 40) continue;
      cx.globalAlpha = n.hit === 2 ? 0.25 : 1; cx.fillStyle = LANE_COL[n.lane];
      const w = lw * 0.78, h = 22; cx.beginPath(); cx.roundRect(laneX(n.lane) - w / 2, y - h / 2, w, h, 11); cx.fill(); cx.globalAlpha = 1;
    }
    for (const f of G.fx) { cx.globalAlpha = Math.max(0, f.life * 2); cx.fillStyle = f.c; cx.fillRect(f.x - 3, f.y - 3, 6, 6); } cx.globalAlpha = 1;
    // 글자
    if (G.st === 'play') {
      txt(String(G.score).padStart(7, '0'), W / 2, 54, 34, '#fff');
      if (G.combo >= 3) txt(G.combo + ' COMBO', W / 2, H * 0.42, 30 + p * 6, '#C8FF2E');
      if (G.judge && t - G.judge[1] < 0.5) txt(G.judge[0], W / 2, H * 0.5, 40, ['#C8FF2E', '#5CE1FF', '#FFC94D', '#ff5a5a'][G.judge[2]]);
      const pr = Math.max(0, Math.min(1, t / (SONG_LEN - 2))); cx.fillStyle = '#ffffff22'; cx.fillRect(x0, 16, lw * 4, 5); cx.fillStyle = '#C8FF2E'; cx.fillRect(x0, 16, lw * 4 * pr, 5);
      let s = ''; for (const [st, nm] of G.song.sec) if (st <= t) s = nm; txt({ intro: '전주', verse: '1절', chorus: '후렴', break: '간주', end: '끝' }[s] || '', x0 + 4, 84, 15, '#ffffff77', 500, 'left');
    } else {
      cx.fillStyle = '#0E0F12dd'; cx.fillRect(0, 0, W, H);
      if (G.st === 'title') {
        txt('한 줄 비트', W / 2, H * 0.3, 54, '#C8FF2E');
        txt('곡도, 노트도 코드가 만든 리듬 게임', W / 2, H * 0.3 + 44, 18, '#fff', 500);
        txt(`곡 번호 #${G.seed}   ◀ ▶ 로 바꾸기`, W / 2, H * 0.48, 20, '#fff', 500);
        txt(G.hard ? '어려움 (위/아래 키)' : '보통 (위/아래 키)', W / 2, H * 0.48 + 34, 18, G.hard ? '#FF6FB5' : '#5CE1FF', 500);
        txt(`노트 ${total()}개 · 120 BPM · 1분 4초`, W / 2, H * 0.48 + 64, 16, '#ffffff99', 500);
        txt('스페이스 / 화면 터치로 시작', W / 2, H * 0.72, 22, '#fff');
        txt('D F J K 또는 줄을 터치', W / 2, H * 0.72 + 32, 16, '#ffffff99', 500);
        if (G.best) txt('최고 ' + G.best, W / 2, H * 0.72 + 62, 16, '#FFC94D', 500);
      } else {
        const a = acc(); txt(rank(a), W / 2, H * 0.3, 120, '#C8FF2E');
        txt(`${G.score}점 · 정확도 ${(a * 100).toFixed(1)}%`, W / 2, H * 0.3 + 56, 24, '#fff');
        txt(`PERFECT ${G.cnt[0]}  GREAT ${G.cnt[1]}  GOOD ${G.cnt[2]}  MISS ${G.cnt[3]}`, W / 2, H * 0.3 + 92, 16, '#ffffffaa', 500);
        txt(`최대 콤보 ${G.maxc} / ${total()}`, W / 2, H * 0.3 + 120, 16, '#ffffffaa', 500);
        txt('스페이스 / 터치로 다시', W / 2, H * 0.72, 22, '#fff');
      }
    }
  }
  // ---------- 입력 ----------
  addEventListener('keydown', e => {
    if (e.repeat) return; const k = e.key.toLowerCase(), l = KEYS.indexOf(k);
    if (l >= 0) return hitLane(l);
    if (G.st !== 'play') {
      if (k === ' ' || k === 'enter') begin();
      if (k === 'arrowleft' || k === 'arrowright') { G.seed = Math.max(1, G.seed + (k === 'arrowleft' ? -1 : 1)); newSong(); }
      if (k === 'arrowup' || k === 'arrowdown') { G.hard = !G.hard; newSong(); }
    }
  });
  cv.addEventListener('pointerdown', e => {
    if (G.st !== 'play') return begin();
    const l = Math.floor((e.clientX - (laneX(0) - laneW() / 2)) / laneW()); if (l >= 0 && l < 4) hitLane(l);
  });
  if (!REC) { let last = performance.now(); (function loop(ts) { step((ts - last) / 1000); last = ts; draw(); requestAnimationFrame(loop); })(last); }
  // 녹화·테스트용
  window.__api = { G, compose, chart, synth, begin, step, draw, hitLane, acc, rank, BEAT, LEAD, SONG_LEN, newSong, resize };
})();

</script>
